name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  BUILDROOT_VERSION: "2025.02"
  # CMake 4.x on the runner rejects old cmake_minimum_required; allow legacy.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  gui-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install dev deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ pkg-config qt6-base-dev libwim-dev libhivex-dev \
            libgl1-mesa-dev libglx-dev libopengl-dev libxkbcommon-dev libvulkan-dev ntfs-3g-dev libfuse-dev
      - name: Inspect hivex header
        run: |
          sed -n '/struct hive_set_value/,/};/p' /usr/include/hivex.h || true
          grep -n "hivex_node_set_value\|hive_t_REG_SZ\|typedef.*hive_t\|} hive_t" /usr/include/hivex.h || true
      - name: Configure & build GUI
        run: |
          cmake -S src/gui -B gui-build -DCMAKE_BUILD_TYPE=Release
          cmake --build gui-build -j"$(nproc)"

  devtest:
    # 普通 Linux（发行版 Qt6/wimlib/hivex）先验证功能，Buildroot 只负责打包集成
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install dev deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ pkg-config qt6-base-dev libwim-dev libhivex-dev \
            libgl1-mesa-dev libglx-dev libopengl-dev libxkbcommon-dev libvulkan-dev \
            ntfs-3g ntfs-3g-dev libssl-dev
      - name: Build libbde (BitLocker)
        run: |
          curl -fsSL -o lb.tar.gz "https://github.com/libyal/libbde/releases/download/20260916/libbde-alpha-20260916.tar.gz"
          tar -xzf lb.tar.gz
          cd libbde-20260916
          ./configure --prefix="$RUNNER_TEMP/libbde" --disable-nls --without-libfuse
          make -j"$(nproc)"
          make install
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/libbde/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/libbde/lib" >> "$GITHUB_ENV"
      - name: Build self test
        run: |
          cmake -S src/gui -B dev-build -DCMAKE_BUILD_TYPE=Release -DBUILD_SELFTEST=ON
          cmake --build dev-build -j"$(nproc)" --target lbpe-selftest
      - name: UEFI load option parse
        run: ./dev-build/lbpe-selftest uefi
      - name: GUI constructs all pages + screenshots
        run: ./dev-build/lbpe-selftest gui "$RUNNER_TEMP/shots"
      - name: Upload GUI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: warn
      - name: WIM capture/apply
        run: ./dev-build/lbpe-selftest wim "$RUNNER_TEMP/wim"
      - name: BCD read/write
        run: |
          curl -fsSL -o "$RUNNER_TEMP/bcd.hive" \
            https://raw.githubusercontent.com/ignore-me-lol/bcd-hive/main/b.hive
          cp "$RUNNER_TEMP/bcd.hive" "$RUNNER_TEMP/bcd-work.hive"
          ./dev-build/lbpe-selftest bcd "$RUNNER_TEMP/bcd-work.hive"
      - name: GPT create/append/guard
        run: |
          truncate -s 64M "$RUNNER_TEMP/disk.img"
          DEV=$(sudo losetup --find --show "$RUNNER_TEMP/disk.img")
          echo "loop=$DEV"
          sudo ./dev-build/lbpe-selftest gpt "$DEV"
          sudo losetup -d "$DEV"
      - name: NTFS mount, attributes, ACL
        run: |
          truncate -s 64M "$RUNNER_TEMP/ntfs.img"
          sudo mkntfs -F -q -L LBPE "$RUNNER_TEMP/ntfs.img"
          DEV=$(sudo losetup --find --show "$RUNNER_TEMP/ntfs.img")
          echo "loop=$DEV"
          sudo ./dev-build/lbpe-selftest ntfs "$DEV" "$RUNNER_TEMP/ntfsmnt"
          sudo losetup -d "$DEV"
      - name: BitLocker smoke (non-BitLocker volume must fail cleanly)
        run: ./dev-build/lbpe-selftest bde "$RUNNER_TEMP/ntfs.img"

  base:
    needs: gui-check
    # 22.04 = gcc11/glibc2.35/cmake3.22: Buildroot 2025.02 builds cleanly here
    # (24.04's cmake4/new-glibc break host-hiredis/host-m4).
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc g++ make patch gzip bzip2 tar cpio \
            python3 rsync wget file libncurses-dev bc unzip \
            xorriso mtools dosfstools genisoimage \
            grub-common grub-pc-bin grub-efi-amd64-bin

      - name: Cache Buildroot downloads
        uses: actions/cache@v4
        with:
          path: ~/.buildroot-dl
          key: br-dl-${{ env.BUILDROOT_VERSION }}-${{ hashFiles('buildroot-external/configs/*') }}
          restore-keys: |
            br-dl-${{ env.BUILDROOT_VERSION }}-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.buildroot-ccache
          key: br-ccache-${{ env.BUILDROOT_VERSION }}-${{ github.sha }}
          restore-keys: |
            br-ccache-${{ env.BUILDROOT_VERSION }}-

      - name: Cache base build tree
        uses: actions/cache@v4
        with:
          path: |
            output/host
            output/target
            output/images
            output/build/*/.stamp_*
            output/build/*/.files-list*
          key: br-base-${{ env.BUILDROOT_VERSION }}-${{ hashFiles('buildroot-external/**') }}

      - name: Configure Buildroot
        run: ci/setup-buildroot.sh

      - name: Build shared toolchain, host tools, kernel and common dependencies
        run: |
          OUT="$GITHUB_WORKSPACE/output"
          make -C "$OUT" -j"$(nproc)" \
            host-pkgconf host-cmake host-libtool host-autoconf host-automake host-gettext \
            host-qt6base \
            qt6base-depends \
            double-conversion libb2 pcre2 zlib freetype fontconfig expat libopenssl libbde \
            linux busybox bash dejavu wqy-zenhei \
            dosfstools util-linux attr

      - name: Archive base output
        run: ci/save-base-output.sh

      - name: Upload base output
        uses: actions/upload-artifact@v4
        with:
          name: base-output
          path: base-output.tar.gz
          retention-days: 3

  parts:
    needs: base
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: qt
            targets: qt6base
            packages: qt6base
          - name: storage
            targets: ntfs-3g libxml2 wimlib hivex
            packages: ntfs-3g libxml2 wimlib hivex
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc g++ make patch gzip bzip2 tar cpio \
            python3 rsync wget file libncurses-dev bc unzip \
            xorriso mtools dosfstools genisoimage \
            grub-common grub-pc-bin grub-efi-amd64-bin

      - name: Cache Buildroot downloads
        uses: actions/cache@v4
        with:
          path: ~/.buildroot-dl
          key: br-dl-${{ env.BUILDROOT_VERSION }}-${{ hashFiles('buildroot-external/configs/*') }}
          restore-keys: |
            br-dl-${{ env.BUILDROOT_VERSION }}-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.buildroot-ccache
          key: br-ccache-${{ env.BUILDROOT_VERSION }}-${{ github.sha }}
          restore-keys: |
            br-ccache-${{ env.BUILDROOT_VERSION }}-

      - name: Configure Buildroot
        run: ci/setup-buildroot.sh

      - name: Download base output
        uses: actions/download-artifact@v4
        with:
          name: base-output
          path: .

      - name: Restore base output
        # 归档只带 .stamp_*，保留其相互顺序；checkout 出来的 linux.fragment / defconfig
        # mtime 比 stamp 新会让 kconfig 规则判配置过期（此时并无内核源码），故把仓库
        # 里的配置类文件统一改成旧时间，而不是去刷新 stamp（刷新会打乱 stamp 先后）。
        run: |
          tar -xzf base-output.tar.gz -C output
          find buildroot-external -type f -exec touch -d '2000-01-01T00:00:00Z' {} +

      - name: Link Buildroot staging sysroot
        run: ci/link-staging.sh

      - name: Build ${{ matrix.name }} package group
        run: make -C "$GITHUB_WORKSPACE/output" -j"$(nproc)" ${{ matrix.targets }}

      - name: Collect installed overlay
        run: ci/build-overlay.sh ${{ matrix.packages }}

      - name: Collect package build stamps
        run: ci/save-part-build.sh ${{ matrix.packages }}

      - name: Upload part artifacts
        uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.name }}
          path: |
            part-overlay.tar.gz
            part-build.tar.gz
          retention-days: 3

  final:
    needs: [base, parts]
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc g++ make patch gzip bzip2 tar cpio \
            python3 rsync wget file libncurses-dev bc unzip \
            xorriso mtools dosfstools genisoimage \
            grub-common grub-pc-bin grub-efi-amd64-bin

      - name: Cache Buildroot downloads
        uses: actions/cache@v4
        with:
          path: ~/.buildroot-dl
          key: br-dl-${{ env.BUILDROOT_VERSION }}-${{ hashFiles('buildroot-external/configs/*') }}
          restore-keys: |
            br-dl-${{ env.BUILDROOT_VERSION }}-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.buildroot-ccache
          key: br-ccache-${{ env.BUILDROOT_VERSION }}-${{ github.sha }}
          restore-keys: |
            br-ccache-${{ env.BUILDROOT_VERSION }}-

      - name: Configure Buildroot
        run: ci/setup-buildroot.sh

      - name: Download base output
        uses: actions/download-artifact@v4
        with:
          name: base-output
          path: .

      - name: Download parallel part artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: parts

      - name: Restore base and part overlays
        run: |
          set -euo pipefail
          tar -xzf base-output.tar.gz -C output
          find parts -mindepth 1 -maxdepth 1 -type d | while read -r part; do
            tar -xzf "$part/part-overlay.tar.gz" -C output
            tar -xzf "$part/part-build.tar.gz" -C output/build
          done
          find buildroot-external -type f -exec touch -d '2000-01-01T00:00:00Z' {} +
          ci/link-staging.sh

      - name: Build GUI and assemble ISO
        run: make -C "$GITHUB_WORKSPACE/output" -j"$(nproc)"

      - name: Collect images
        run: |
          mkdir -p artifacts
          find "$GITHUB_WORKSPACE/output/images" -maxdepth 1 -type f \
            \( -name '*.iso' -o -name '*.img' \) -exec cp -v {} artifacts/ \; || true
          ls -la artifacts

      - name: Verify ISO structure
        run: tools/verify-iso.sh "$(ls artifacts/*.iso | head -1)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linuxbasepe-images
          path: artifacts/*
          if-no-files-found: warn

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
