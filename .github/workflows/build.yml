name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  BUILDROOT_VERSION: "2025.02"
  # CMake 4.x on the runner rejects old cmake_minimum_required; allow legacy.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  build:
    needs: gui-check
    # 22.04 = gcc11/glibc2.35/cmake3.22: Buildroot 2025.02 builds cleanly here
    # (24.04's cmake4/new-glibc break host-hiredis/host-m4).
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc g++ make patch gzip bzip2 tar cpio \
            python3 rsync wget file libncurses-dev bc unzip \
            xorriso mtools dosfstools genisoimage \
            grub-common grub-pc-bin grub-efi-amd64-bin

      - name: Cache Buildroot downloads
        uses: actions/cache@v4
        with:
          path: ~/.buildroot-dl
          key: br-dl-${{ env.BUILDROOT_VERSION }}-${{ hashFiles('buildroot-external/configs/*') }}
          restore-keys: |
            br-dl-${{ env.BUILDROOT_VERSION }}-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.buildroot-ccache
          key: br-ccache-${{ env.BUILDROOT_VERSION }}-${{ github.sha }}
          restore-keys: |
            br-ccache-${{ env.BUILDROOT_VERSION }}-

      - name: Fetch Buildroot
        run: |
          wget -q "https://buildroot.org/downloads/buildroot-${BUILDROOT_VERSION}.tar.gz" -O /tmp/buildroot.tar.gz
          mkdir -p "$HOME/buildroot"
          tar -xzf /tmp/buildroot.tar.gz -C "$HOME/buildroot" --strip-components=1

      - name: Configure
        run: |
          mkdir -p ~/.buildroot-dl
          make -C "$HOME/buildroot" \
            BR2_EXTERNAL="$GITHUB_WORKSPACE/buildroot-external" \
            BR2_DL_DIR="$HOME/.buildroot-dl" \
            O="$GITHUB_WORKSPACE/output" \
            linuxbasepe_x86_64_defconfig

      - name: Build
        run: |
          make -C "$GITHUB_WORKSPACE/output" -j"$(nproc)"

      - name: Collect images
        run: |
          mkdir -p artifacts
          find "$GITHUB_WORKSPACE/output/images" -maxdepth 1 -type f \
            \( -name '*.iso' -o -name '*.img' \) -exec cp -v {} artifacts/ \; || true
          ls -la artifacts

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linuxbasepe-images
          path: artifacts/*
          if-no-files-found: warn

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  # Fast compile-check of the native C++ GUI against distro Qt6/wimlib/hivex,
  # so API/compile errors surface in minutes instead of after a full Buildroot run.
  gui-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install dev deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ pkg-config qt6-base-dev libwim-dev libhivex-dev ntfs-3g-dev libfuse-dev \
            libgl1-mesa-dev libglx-dev libopengl-dev libxkbcommon-dev libvulkan-dev
      - name: Inspect hivex header
        run: |
          sed -n '/struct hive_set_value/,/};/p' /usr/include/hivex.h || true
          grep -n "hivex_node_set_value\|hive_t_REG_SZ\|typedef.*hive_t\|} hive_t" /usr/include/hivex.h || true
      - name: Configure & build GUI
        run: |
          cmake -S src/gui -B gui-build -DCMAKE_BUILD_TYPE=Release
          cmake --build gui-build -j"$(nproc)"