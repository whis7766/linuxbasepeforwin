set timeout=3
set default=0

# UEFI 从 El Torito 的 FAT 镜像启动时根设备不是 ISO，先按文件定位回 ISO 根。
search --no-floppy --file /boot/bzImage --set-root

menuentry "linuxbasepeforwin (Live RAM)" {
    linux /boot/bzImage console=ttyS0,115200 console=tty0 quiet
    initrd /boot/rootfs.cpio.gz
}
menuentry "linuxbasepeforwin (verbose)" {
    linux /boot/bzImage console=ttyS0,115200 console=tty0
    initrd /boot/rootfs.cpio.gz
}